<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Deadlight Outpost</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #05070f;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #d7e3c8;
  }
  #game {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    display: block;
    background: #05070f;
    cursor: crosshair;
    touch-action: none;
  }
  #hud {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 10;
    user-select: none;
  }
  #vignette {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 5;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 52%, rgba(0,0,0,0.55) 88%, rgba(0,0,0,0.85) 100%);
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.min.js"
  }
}
</script>
</head>
<body>
<canvas id="game"></canvas>
<div id="vignette"></div>
<div id="hud"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
